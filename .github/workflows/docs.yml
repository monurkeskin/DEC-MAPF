name: Documentation website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked documentation environment
        run: |
          python -m pip install uv==0.11.18
          uv sync --locked --extra docs
      - name: Check documentation and build the site
        run: |
          .venv/bin/python scripts/check_documentation.py
          .venv/bin/python scripts/build_docs.py
      - name: Upload the checked site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/site

  deploy:
    if: github.repository == 'monurkeskin/DEC-MAPF' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@v4
