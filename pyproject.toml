[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dec-mapf"
version = "0.1.0a2"
description = "Python simulation and experimentation framework for Decentralized Multi-Agent Path Finding, centralized comparisons and method development."
authors = [
    {name = "M. Onur Keskin", email = "onurkeskin97@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "multi-agent-path-finding",
    "mapf",
    "decentralized-mapf",
    "multi-agent-simulation",
    "reproducible-experiments",
    "automated-negotiation",
    "space-time-a-star",
    "decentralized-planning",
    "jaamas",
    "robotics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["pydantic>=2.10,<3", "rfc8785==0.1.4"]

[project.urls]
Homepage = "https://github.com/monurkeskin/DEC-MAPF"
Documentation = "https://monurkeskin.github.io/DEC-MAPF/"
"Reference Publication" = "https://doi.org/10.1007/s10458-024-09639-8"
"Issue Tracker" = "https://github.com/monurkeskin/DEC-MAPF/issues"

[project.scripts]
mapf = "mapf.cli:main"

[project.optional-dependencies]
resources = ["psutil>=7,<8"]
gui = [
    "polars>=1.20.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
analysis = [
    "numpy>=2.0.0",
    "rich>=13.8.0",
    "polars>=1.20.0",
    "matplotlib>=3.10.0",
    "scienceplots>=2.1.1",
    "pyarrow>=14.0.0",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "plotly==7.1.0",
]
benchmark = [
    "polars>=1.20.0",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "pyarrow>=14.0.0",
]
distributed = [
    "ray>=2.40.0",
]
dev = [
    "psutil>=7,<8",
    "pytest-asyncio>=1.4.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.6.0",
    "pytest-mock>=3.14.0",
    "pytest-watcher>=0.4.0",
    "hypothesis>=6.120.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
]
all = [
    "numpy>=2.0.0",
    "rich>=13.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "polars>=1.20.0",
    "matplotlib>=3.10.0",
    "scienceplots>=2.1.1",
    "pyarrow>=14.0.0",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "plotly==7.1.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["mapf"]
branch = true
relative_files = true
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"

[tool.setuptools.package-data]
"mapf.analytics" = ["templates/*.html"]
"mapf.gui" = ["static/*.html", "static/workspace/*", "static/workspace/assets/*"]

[tool.uv]
constraint-dependencies = [
    "pydantic==2.13.5", "fastapi==0.141.1", "uvicorn==0.53.0", "polars==1.44.2",
    "numpy==2.5.3", "pyarrow==23.0.1", "matplotlib==3.11.2", "scienceplots==2.2.2",
    "rich==14.3.4", "pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.168.0",
    "ruff==0.16.8", "mypy==2.3.1", "httpx==0.28.1"
]
